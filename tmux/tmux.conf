# Prefix: Ctrl+A
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload configuration: Ctrl+A, then r
bind-key r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Split panes
unbind-key %
unbind-key '"'
bind-key / split-window -h
bind-key - split-window -v

# Navigate between panes
bind-key Left select-pane -L
bind-key Right select-pane -R
bind-key Up select-pane -U
bind-key Down select-pane -D

# Rename current pane: Ctrl+A, then t
bind-key t command-prompt -p "Pane title:" "select-pane -T '%%'"

# Display pane titles
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_title} "

# General settings
set-option -g mouse on
set-option -g history-limit 100000
set-option -sg escape-time 0
set-option -g status off
